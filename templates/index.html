<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Blind-first HTML website builder with conversational AI, Hindi and English voice, local preview, and audio explanation.">
  <title>CodeUp HTML - Blind-first Website Builder</title>
  <link rel="stylesheet" href="/static/style/fonts.css">
  <link rel="stylesheet" href="/static/style/core.css">
  <link rel="stylesheet" href="/static/style/accessibility.css">
  <link rel="stylesheet" href="/static/style/ui-improvements.css">
</head>
<body class="cu-body">
  <div id="srAnnouncer" role="status" aria-live="assertive" aria-atomic="true"
       style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;"></div>

  <header class="cu-header">
    <div class="cu-header-top">
      <h1 class="cu-title">CODEUP HTML</h1>
      <div class="cu-status-pill" aria-label="HTML builder with voice">HTML + VOICE</div>
    </div>
    <div class="cu-subtitle">
      Blind-first website builder. Press <span class="cu-hotkey">Ctrl+Enter</span> to preview.
    </div>
    <div class="cu-subtitle-info">
      <small>Voice coding - Hindi and English - sonification - local website hosting</small>
    </div>
    <div class="cu-theme-controls" role="group" aria-label="Accessibility settings">
      <select id="colorVisionMode" class="theme-selector" aria-label="Color vision mode">
        <option value="default">Standard Colors</option>
        <option value="protanopia">Protanopia</option>
        <option value="deuteranopia">Deuteranopia</option>
        <option value="tritanopia">Tritanopia</option>
        <option value="high-contrast">High Contrast</option>
      </select>
      <button id="dyslexiaToggle" class="theme-toggle" aria-pressed="false">Dyslexia Mode</button>
      <button id="motionToggle" class="theme-toggle" aria-pressed="false">Reduce Motion</button>
      <button id="nightToggle" class="theme-toggle" aria-pressed="false">Night Mode</button>
      <button id="demoModeBtn" class="theme-toggle" aria-pressed="false">Demo Mode</button>
    </div>
  </header>

  <main class="cu-main">
    <section class="cu-panel cu-editor-wrapper" aria-label="HTML website workspace">
      <div id="editor" class="cu-editor" role="region" aria-label="HTML website editor"></div>
      <div class="cu-command-bar" role="toolbar" aria-label="Website actions">
        <button class="cu-button cu-button-primary" id="runBtn" aria-label="Preview HTML website">Preview</button>
        <button class="cu-button" id="analyzeBtn" aria-label="Explain what the website looks like">Explain</button>
        <button class="cu-button" id="fixBtn" aria-label="Polish HTML accessibility and layout">Polish</button>
        <button class="cu-button" id="auditBtn" aria-label="Audit accessibility and page quality">Audit</button>
        <button class="cu-button" id="outlineBtn" aria-label="Summarize the website outline">Outline</button>
        <button class="cu-button" id="exportBtn" aria-label="Export website as an HTML file">Export</button>
        <button class="cu-button" id="resetBtn" aria-label="Reset this session">Reset</button>
        <button class="cu-button cu-button-voice" id="voiceButton" aria-label="Toggle voice control" aria-pressed="false">Voice Off</button>
        <button class="cu-button cu-button-secondary" id="helpBtn" aria-label="Ask what CodeUp HTML can do">Help</button>
        <select id="languageSelector" class="cu-language-selector" aria-label="Select spoken language">
          <option value="en">English</option>
          <option value="hi">Hindi / Hinglish</option>
        </select>
      </div>
    </section>

    <aside class="cu-panel cu-output-panel" aria-label="Output and website preview">
      <div class="cu-output-header">
        <span>OUTPUT</span>
      </div>
      <pre id="output" class="cu-output-box" tabindex="0" aria-live="polite"></pre>
      <div class="cu-command-row">
        <input id="commandInput" type="text"
               placeholder="Ask what you can do, or build a website for a school science fair..."
               aria-label="Ask CodeUp or request a website">
        <button id="sendCommandBtn" class="cu-button cu-button-primary" aria-label="Ask CodeUp or build a website">Ask / Build</button>
      </div>
      <div id="sitePreview" class="cu-site-preview" aria-label="Local website preview"></div>
    </aside>
  </main>

  <script src="/static/codeup-html.js?v=html-only"></script>
</body>
</html>
